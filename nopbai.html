<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Nộp Bài Thi - EVN SPC</title>
    <style>
        /* Thiết lập không viền, không cuộn */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* CSS cho nút Fullscreen nổi ở góc phải bên dưới */
        #btn-fullscreen {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: all 0.3s ease;
        }
        #btn-fullscreen:hover {
            background-color: #1557b0;
            transform: scale(1.1);
        }
        #btn-fullscreen svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://script.google.com/macros/s/AKfycbwMTIPpVMBtD-b0KuFbWwtxsSNdkjVwM7d6N3qf47Y5-NvNdE0YuVisc0OVbMruPw0Y/exec?p=nopbai" 
        allow="camera *; geolocation *; microphone *; autoplay *; fullscreen *"
        title="Dashboard Nộp Bài EVN SPC">
    </iframe>

    <button id="btn-fullscreen" onclick="toggleFullScreen()" title="Bật/Tắt Toàn Màn Hình">
        <svg id="fs-icon" viewBox="0 0 24 24">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
    </button>

    <script>
        // Hàm xử lý phóng to / thu nhỏ màn hình
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Lỗi khi bật toàn màn hình: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Lắng nghe sự kiện thay đổi màn hình để đổi Icon cho phù hợp
        document.addEventListener('fullscreenchange', (event) => {
            const icon = document.getElementById('fs-icon');
            if (document.fullscreenElement) {
                // Đổi sang Icon Thu nhỏ
                icon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
            } else {
                // Đổi về Icon Phóng to
                icon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
            }
        });
    </script>
</body>
</html>
