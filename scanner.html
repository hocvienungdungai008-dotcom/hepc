<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quét Bài Thi SOL61</title>
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .video-container { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
        video { width: 100%; height: auto; display: block; }
        canvas { width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid #ddd; display: none; }
        .controls { margin: 20px 0; }
        button { padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; color: white; width: 100%; margin-bottom: 10px; }
        #captureBtn { background: #007bff; }
        #captureBtn:disabled { background: #ccc; }
        #downloadBtn { background: #28a745; display: none; }
        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { font-size: 13px; margin-bottom: 10px; color: #555; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div>Đang xử lý ảnh...</div>
</div>

<div class="container">
    <h3>MÁY QUÉT CẦM TAY SOL61</h3>
    <div id="status">Đang tải thư viện...</div>
    
    <div class="video-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="captureBtn" disabled>QUÉT VÀ CẮT ẢNH</button>
        <button id="downloadBtn">TẢI FILE ẢNH</button>
    </div>

    <canvas id="outputCanvas"></canvas>
</div>

<script>
    const video = document.getElementById('video');
    const captureBtn = document.getElementById('captureBtn');
    const outputCanvas = document.getElementById('outputCanvas');
    const status = document.getElementById('status');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const downloadBtn = document.getElementById('downloadBtn');

    function checkOpenCV() {
        if (typeof cv !== 'undefined' && cv.Mat) {
            status.innerText = "Hệ thống sẵn sàng";
            captureBtn.disabled = false;
            startCamera();
        } else {
            setTimeout(checkOpenCV, 500);
        }
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            video.srcObject = stream;
            video.play();
        } catch (err) {
            status.innerText = "Lỗi camera: " + err.message;
        }
    }

    window.onload = checkOpenCV;

    captureBtn.onclick = () => {
        loadingOverlay.style.display = 'flex';
        video.pause();

        setTimeout(() => {
            try {
                // KIỂM TRA KÍCH THƯỚC VIDEO TRƯỚC KHI KHỞI TẠO MAT
                const vW = video.videoWidth;
                const vH = video.videoHeight;

                if (vW <= 0 || vH <= 0) {
                    throw new Error("Kích thước video không hợp lệ. Hãy thử lại.");
                }

                let src = new cv.Mat(vH, vW, cv.CV_8UC4);
                let cap = new cv.VideoCapture(video);
                cap.read(src);

                let dst = new cv.Mat();
                cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(dst, dst, new cv.Size(5, 5), 0);
                cv.Canny(dst, dst, 75, 200);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(dst, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let maxContourIndex = -1;

                for (let i = 0; i < contours.size(); ++i) {
                    let area = cv.contourArea(contours.get(i));
                    if (area > maxArea) {
                        maxArea = area;
                        maxContourIndex = i;
                    }
                }

                if (maxContourIndex !== -1) {
                    let contour = contours.get(maxContourIndex);
                    let peri = cv.arcLength(contour, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(contour, approx, 0.02 * peri, true);

                    // Chỉ thực hiện Perspective nếu tìm thấy đúng 4 góc và diện tích đủ lớn
                    if (approx.rows === 4 && cv.contourArea(approx) > (vW * vH * 0.1)) {
                        applyPerspective(src, approx);
                    } else {
                        status.innerText = "Không tìm thấy khung giấy phù hợp. Hiển thị ảnh gốc.";
                        cv.imshow('outputCanvas', src);
                    }
                    approx.delete();
                } else {
                    cv.imshow('outputCanvas', src);
                }

                outputCanvas.style.display = 'block';
                downloadBtn.style.display = 'block';

                // Giải phóng
                src.delete(); dst.delete(); contours.delete(); hierarchy.delete();

            } catch (err) {
                alert("Lỗi xử lý: " + err.message);
                console.error(err);
            } finally {
                loadingOverlay.style.display = 'none';
                video.play();
            }
        }, 300);
    };

    function applyPerspective(src, approx) {
        let pts = [];
        for (let i = 0; i < 4; i++) {
            pts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
        }

        pts.sort((a, b) => a.y - b.y);
        let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
        let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);

        let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
            top[0].x, top[0].y, top[1].x, top[1].y,
            bottom[0].x, bottom[0].y, bottom[1].x, bottom[1].y
        ]);

        // Đảm bảo kích thước đầu ra cố định để tránh lỗi bad size
        const outW = 800;
        const outH = 1131; 

        let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW, 0, 0, outH, outW, outH]);
        let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
        let result = new cv.Mat();
        
        cv.warpPerspective(src, result, M, new cv.Size(outW, outH));

        // Xử lý bộ lọc trắng đen
        cv.cvtColor(result, result, cv.COLOR_RGBA2GRAY);
        cv.adaptiveThreshold(result, result, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 15);

        cv.imshow('outputCanvas', result);

        result.delete(); M.delete(); srcCoords.delete(); dstCoords.delete();
    }

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.download = 'scan_sol61.png';
        link.href = outputCanvas.toDataURL();
        link.click();
    };
</script>
</body>
</html>
