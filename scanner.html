<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quét Bài Thi A4</title>
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .video-container { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; line-height: 0; }
        video { width: 100%; height: auto; transform: scaleX(1); }
        
        canvas { width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid #ddd; display: none; }
        
        .controls { margin: 20px 0; }
        button { padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 50px; color: white; transition: 0.3s; width: 100%; }
        #captureBtn { background: #007bff; }
        #captureBtn:disabled { background: #ccc; cursor: not-allowed; }
        #downloadBtn { background: #28a745; margin-top: 10px; display: none; }

        /* Vòng xoay tiến độ */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #status { font-size: 14px; margin-bottom: 10px; color: #666; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">Đang xử lý và căn chỉnh ảnh...</div>
</div>

<div class="container">
    <h3>QUÉT GIẤY THI A4</h3>
    <div id="status">Đang khởi động hệ thống...</div>
    
    <div class="video-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="captureBtn" disabled>QUÉT VÀ CẮT ẢNH</button>
        <button id="downloadBtn">TẢI ẢNH ĐÃ QUÉT</button>
    </div>

    <canvas id="outputCanvas"></canvas>
</div>

<script>
    const video = document.getElementById('video');
    const captureBtn = document.getElementById('captureBtn');
    const outputCanvas = document.getElementById('outputCanvas');
    const status = document.getElementById('status');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const downloadBtn = document.getElementById('downloadBtn');

    // 1. Kiểm tra OpenCV và Camera
    function checkStatus() {
        if (typeof cv !== 'undefined' && cv.Mat) {
            status.innerText = "Hệ thống sẵn sàng. Hãy đặt giấy thi vào khung hình.";
            status.style.color = "green";
            captureBtn.disabled = false;
            startCamera();
        } else {
            setTimeout(checkStatus, 500);
        }
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
            });
            video.srcObject = stream;
        } catch (err) {
            status.innerText = "Không thể mở camera: " + err.message;
            status.style.color = "red";
        }
    }

    window.onload = checkStatus;

    // 2. Xử lý khi bấm nút Quét
    captureBtn.onclick = () => {
        // Hiển thị vòng xoay và dừng video
        loadingOverlay.style.display = 'flex';
        video.pause();

        // Đợi 1 chút để UI kịp hiển thị vòng xoay
        setTimeout(() => {
            try {
                const width = video.videoWidth;
                const height = video.videoHeight;
                
                let src = new cv.Mat(height, width, cv.CV_8UC4);
                let cap = new cv.VideoCapture(video);
                cap.read(src);

                let dst = new cv.Mat();
                cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(dst, dst, new cv.Size(5, 5), 0);
                cv.Canny(dst, dst, 75, 200);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(dst, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let maxContourIndex = -1;

                for (let i = 0; i < contours.size(); ++i) {
                    let area = cv.contourArea(contours.get(i));
                    if (area > maxArea) {
                        maxArea = area;
                        maxContourIndex = i;
                    }
                }

                if (maxContourIndex !== -1) {
                    let contour = contours.get(maxContourIndex);
                    let peri = cv.arcLength(contour, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(contour, approx, 0.02 * peri, true);

                    if (approx.rows === 4) {
                        applyPerspective(src, approx, width, height);
                    } else {
                        status.innerText = "Không nhận diện đủ 4 góc, đang lấy ảnh gốc.";
                        cv.imshow('outputCanvas', src);
                    }
                    approx.delete();
                } else {
                    cv.imshow('outputCanvas', src);
                }

                outputCanvas.style.display = 'block';
                downloadBtn.style.display = 'block';
                
                // Giải phóng bộ nhớ
                src.delete(); dst.delete(); contours.delete(); hierarchy.delete();

            } catch (err) {
                console.error(err);
                alert("Có lỗi xảy ra khi xử lý ảnh.");
            } finally {
                loadingOverlay.style.display = 'none';
                video.play();
            }
        }, 200);
    };

    function applyPerspective(src, approx, w, h) {
        let pts = [];
        for (let i = 0; i < 4; i++) {
            pts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
        }

        // Sắp xếp tọa độ các góc
        pts.sort((a, b) => a.y - b.y);
        let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
        let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);

        let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
            top[0].x, top[0].y, top[1].x, top[1].y,
            bottom[0].x, bottom[0].y, bottom[1].x, bottom[1].y
        ]);

        const outW = 800;
        const outH = 1131; // Tỉ lệ chuẩn A4

        let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW, 0, 0, outH, outW, outH]);
        let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
        let result = new cv.Mat();
        cv.warpPerspective(src, result, M, new cv.Size(outW, outH));

        // Bộ lọc trắng đen giúp chữ rõ nét
        cv.cvtColor(result, result, cv.COLOR_RGBA2GRAY);
        cv.adaptiveThreshold(result, result, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 15);

        cv.imshow('outputCanvas', result);
        
        result.delete(); M.delete(); srcCoords.delete(); dstCoords.delete();
    }

    downloadBtn.onclick = () => {
        const link = document.createElement('a');
        link.download = 'bai_thi_scan.png';
        link.href = outputCanvas.toDataURL();
        link.click();
    };
</script>

</body>
</html>
