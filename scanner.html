<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner HEPC v1.4.0</title>
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        .version-tag { position: absolute; top: 10px; right: 15px; font-size: 11px; color: #999; font-weight: bold; }
        .video-container { width: 100%; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        video, canvas { width: 100%; height: auto; display: block; border-radius: 8px; }
        #canvasPreview { display: none; margin-top: 10px; border: 2px solid #007bff; }
        .controls { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; }
        button { padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; color: white; }
        #btnCapture { background: #6c757d; }
        #btnProcess { background: #007bff; display: none; }
        #btnDownload { background: #28a745; display: none; }
        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">Đang xử lý...</div>
</div>

<div class="container">
    <div class="version-tag">VERSION 1.4.0 HEPC</div>
    <h3>MÁY QUÉT BÀI THI HEPC</h3>
    
    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <!-- Canvas trung gian để giữ ảnh đã chụp -->
        <canvas id="canvasPreview"></canvas>
    </div>

    <div class="controls">
        <button id="btnCapture">BƯỚC 1: CHỤP ẢNH</button>
        <button id="btnProcess">BƯỚC 2: TÌM KHUNG & CẮT</button>
        <button id="btnDownload">BƯỚC 3: LƯU FILE QUÉT</button>
    </div>

    <p id="status" style="font-size: 12px; color: #666;">Đang khởi tạo...</p>
</div>

<script>
    let video = document.getElementById('video');
    let canvasPreview = document.getElementById('canvasPreview');
    let btnCapture = document.getElementById('btnCapture');
    let btnProcess = document.getElementById('btnProcess');
    let btnDownload = document.getElementById('btnDownload');
    let loading = document.getElementById('loadingOverlay');
    let status = document.getElementById('status');

    // Khởi động Camera
    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            video.srcObject = stream;
            status.innerText = "Sẵn sàng chụp ảnh.";
        } catch (e) {
            status.innerText = "Lỗi Camera: " + e.message;
        }
    }

    // Đợi OpenCV
    function onOpenCvReady() {
        if (typeof cv !== 'undefined' && cv.Mat) {
            init();
        } else {
            setTimeout(onOpenCvReady, 500);
        }
    }
    window.onload = onOpenCvReady;

    // BƯỚC 1: CHỤP ẢNH TĨNH
    btnCapture.onclick = () => {
        canvasPreview.width = video.videoWidth;
        canvasPreview.height = video.videoHeight;
        let ctx = canvasPreview.getContext('2d');
        ctx.drawImage(video, 0, 0, canvasPreview.width, canvasPreview.height);
        
        video.style.display = 'none';
        canvasPreview.style.display = 'block';
        btnCapture.innerText = "CHỤP LẠI";
        btnProcess.style.display = 'block';
        status.innerText = "Đã chụp ảnh tĩnh. Nhấn Bước 2 để cắt khung.";
    };

    // BƯỚC 2: XỬ LÝ CẮT KHUNG
    btnProcess.onclick = () => {
        loading.style.display = 'flex';
        
        setTimeout(() => {
            let src = cv.imread(canvasPreview);
            let dst = new cv.Mat();
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();

            try {
                cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(dst, dst, new cv.Size(5, 5), 0);
                cv.Canny(dst, dst, 75, 200);
                cv.findContours(dst, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0, maxIdx = -1;
                for (let i = 0; i < contours.size(); ++i) {
                    let area = cv.contourArea(contours.get(i));
                    if (area > maxArea) { maxArea = area; maxIdx = i; }
                }

                if (maxIdx !== -1) {
                    let approx = new cv.Mat();
                    let peri = cv.arcLength(contours.get(maxIdx), true);
                    cv.approxPolyDP(contours.get(maxIdx), approx, 0.02 * peri, true);

                    if (approx.rows === 4) {
                        // Thực hiện cắt
                        doWarp(src, approx);
                        btnProcess.style.display = 'none';
                        btnDownload.style.display = 'block';
                        status.innerText = "Đã cắt thành công!";
                    } else {
                        throw new Error("Không tìm thấy 4 góc giấy. Hãy chụp lại rõ hơn.");
                    }
                    approx.delete();
                } else {
                    throw new Error("Không nhận diện được khung bài thi.");
                }
            } catch (e) {
                alert(e.message);
                // Hiển thị ảnh gốc nếu lỗi để vẫn có cái nộp
                cv.imshow(canvasPreview, src);
                btnDownload.style.display = 'block';
            } finally {
                src.delete(); dst.delete(); contours.delete(); hierarchy.delete();
                loading.style.display = 'none';
            }
        }, 300);
    };

    function doWarp(src, approx) {
        let pts = [];
        for (let i = 0; i < 4; i++) pts.push({ x: approx.data32S[i * 2], y: approx.data32S[i * 2 + 1] });
        
        pts.sort((a, b) => a.y - b.y);
        let top = pts.slice(0, 2).sort((a, b) => a.x - b.x);
        let bottom = pts.slice(2, 4).sort((a, b) => a.x - b.x);
        
        let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [top[0].x, top[0].y, top[1].x, top[1].y, bottom[1].x, bottom[1].y, bottom[0].x, bottom[0].y]);
        let outW = 800, outH = 1131;
        let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW, 0, outW, outH, 0, outH]);

        let M = cv.getPerspectiveTransform(srcCoords, dstCoords);
        let result = new cv.Mat();
        cv.warpPerspective(src, result, M, new cv.Size(outW, outH));
        
        // Làm nét văn bản
        cv.cvtColor(result, result, cv.COLOR_RGBA2GRAY);
        cv.adaptiveThreshold(result, result, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 15);
        
        cv.imshow(canvasPreview, result);
        
        result.delete(); M.delete(); srcCoords.delete(); dstCoords.delete();
    }

    // BƯỚC 3: LƯU FILE
    btnDownload.onclick = () => {
        let link = document.createElement('a');
        link.download = 'HEPC_SCAN_SUCCESS.png';
        link.href = canvasPreview.toDataURL();
        link.click();
    };
</script>
</body>
</html>
