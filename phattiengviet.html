<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phát âm Tiếng Việt Chuẩn</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        small { color: #666; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Loa Tiếng Việt 🔊</h3>
    <input type="text" id="textInput" value="Xin chào, tôi là trợ lý ảo của bạn." placeholder="Nhập chữ vào đây...">
    <button onclick="playVietnamese()">Bấm OK để nghe</button>
    <p><small>* Lưu ý: Đảm bảo thiết bị của bạn không tắt âm lượng.</small></p>
</div>

<script>
    function playVietnamese() {
        const text = document.getElementById('textInput').value;
        if (!text) return;

        // Dừng các giọng đang đọc dở (nếu có)
        window.speechSynthesis.cancel();

        const msg = new SpeechSynthesisUtterance(text);
        
        // Lấy danh sách tất cả các giọng có trong máy
        const voices = window.speechSynthesis.getVoices();

        // Tìm giọng nào có chứa mã "vi" (Vietnamese)
        const vnVoice = voices.find(voice => voice.lang.includes('vi') || voice.lang.includes('VI'));

        if (vnVoice) {
            msg.voice = vnVoice; // Ép trình duyệt dùng giọng Việt
        } else {
            msg.lang = 'vi-VN'; // Sơ cua nếu không tìm thấy voice object
        }

        msg.rate = 0.9; // Đọc chậm lại một chút cho rõ
        msg.pitch = 1;

        window.speechSynthesis.speak(msg);
    }

    // Một số trình duyệt cần "đánh thức" danh sách giọng nói
    window.speechSynthesis.onvoiceschanged = function() {
        console.log("Đã tải danh sách giọng nói!");
    };
</script>

</body>
</html>
